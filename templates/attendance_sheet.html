<!DOCTYPE html>
<html>
<head>
    <title>Attendance Sheet</title>
</head>
<body>

<h2>Attendance Sheet</h2>

{% for date, students in attendance.items() %}
    <h3>{{ date }}</h3>
    <ul>
        {% for name in students.keys() %}
            <li>{{ name }}</li>
        {% endfor %}
    </ul>
{% endfor %}

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
