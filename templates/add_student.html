<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <style>
        body { font-family: Arial; text-align: center; }
        video { border: 2px solid black; }
        input, button { padding: 8px; margin: 8px; }
    </style>
</head>
<body>

<h2>Add New Student</h2>

<input type="text" id="studentName" placeholder="Student Name" required><br>

<video id="video" width="400" height="300" autoplay></video><br>

<button onclick="startCamera()">Start Camera</button>
<button onclick="captureImage()">Capture Image</button>

<p id="count">Captured: 0</p>

<script>
let video = document.getElementById("video");
let count = 0;

function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
}

function captureImage() {
    let name = document.getElementById("studentName").value;
    if (!name) {
        alert("Enter student name");
        return;
    }

    let canvas = document.createElement("canvas");
    canvas.width = 400;
    canvas.height = 300;
    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, 400, 300);

    canvas.toBlob(blob => {
        let formData = new FormData();
        formData.append("image", blob);
        formData.append("name", name);

        fetch("/save_student_image", {
            method: "POST",
            body: formData
        });

        count++;
        document.getElementById("count").innerText = "Captured: " + count;
    });
}
</script>

</body>
</html>
