<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    Face Recognition Attendance System
</div>

<div class="page-wrapper">
    <div class="container">

        <div class="card">
            <h2>Welcome, {{ teacher_name }}</h2>
            <p><b>Attendance Status:</b> {{ status }}</p>

            <form action="/start_attendance" method="post">
                <button class="btn btn-success">Start Attendance</button>
            </form>

            <form action="/stop_attendance" method="post">
                <button class="btn btn-danger">Stop Attendance</button>
            </form>
        </div>

        <div class="card">
            <button class="btn btn-primary" onclick="location.href='/register_student'">
                Register Student
            </button>

            <button class="btn btn-primary" onclick="location.href='/view_attendance'">
                View Attendance (Day-wise)
            </button>

            <button class="btn btn-primary" onclick="location.href='/attendance_percentage'">
                Attendance Percentage
            </button>
        </div>

        <div class="card">
            <button class="btn btn-primary" onclick="location.href='/download_attendance_today'">
                Download Today Attendance (Excel)
            </button>

            <button class="btn btn-primary" onclick="location.href='/download_attendance_month'">
                Download Monthly Attendance (Excel)
            </button>
        </div>

        <div class="card">
            <button class="btn btn-dark" onclick="location.href='/logout'">
                Logout
            </button>
        </div>

    </div>
</div>

</body>
</html>
